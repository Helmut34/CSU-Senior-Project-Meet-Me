services:
  redis:
    image: redis:7-alpine
    restart: always

  backend:
    build: ./backend
    env_file: .env
    environment:
      - FLASK_ENV=production
      - REDIS_URL=redis://redis:6379/0
    expose:
      - "5000"
    depends_on:
      - redis
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
